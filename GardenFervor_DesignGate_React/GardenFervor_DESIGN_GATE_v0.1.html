        "id": "p2",

        "id": "p3",

            "decision": "La complétude requise avant implémentation est une complétude suffisante, et non une complétude exhaustive. Un domaine est suffisamment défini lorsque : (1) son objectif gameplay est clair — rôle du système et conséquence gameplay attendue définis ; (2) son fonctionnement essentiel est décidé — règles nécessaires au comportement attendu suffisamment définies ; (3) ses dépendances importantes sont connues — systèmes dont il dépend et qu’il impacte identifiés ; (4) ses limites sont explicites — éléments différés ou hors périmètre identifiés ; (5) ses interactions critiques sont cohérentes — aucun point encore indéfini ne doit pouvoir remettre en cause le fonctionnement global déjà validé ; (6) la lisibilité attendue est suffisante — résultat compréhensible par le joueur conformément à DG-13. Règle directrice : on implémente lorsqu’il y a suffisamment de décisions pour construire et valider le comportement attendu, pas lorsqu’il ne reste absolument aucune question théorique. Les détails secondaires, variantes, optimisations et cas rares peuvent rester ouverts s’ils ne remettent pas en cause le comportement fondateur. Évite à la fois une implémentation trop précoce avec règles instables et une spécification exhaustive inutilement bloquante. Une question ouverte devient bloquante seulement si elle peut remettre en cause le comportement fondateur, les dépendances critiques ou la cohérence globale. 14.1 définit le seuil de complétude, pas le contenu détaillé des systèmes."

            "decision": "Avant toute implémentation gameplay structurante, les contradictions susceptibles de rendre l’implémentation instable, contradictoire ou fondamentalement erronée doivent être éliminées. Il n’est pas nécessaire de résoudre toutes les questions encore ouvertes : seules les contradictions susceptibles d’affecter le comportement fondateur, les dépendances critiques ou la source de vérité sont bloquantes. (1) Contradictions de vision gameplay — éliminer celles concernant notamment le rôle du joueur, l’identité RTS, l’autonomie des unités et la transformation du territoire ; aucune implémentation structurante ne doit reposer sur deux interprétations incompatibles de ces fondations. (2) Contradictions des règles fondamentales — doivent être cohérentes entre elles les règles structurantes concernant notamment chantiers, progression, ressources, unités, terrain, environnement, transport et logistique ; une règle d’un domaine ne doit pas rendre impossible ou contradictoire le fonctionnement fondamental d’un autre domaine avec lequel elle interagit. (3) Dépendances critiques — cohérentes avant implémentation ; une décision d’un système ne doit pas contredire une condition nécessaire au fonctionnement d’un autre système dont elle dépend. (4) Source de vérité — lorsqu’une information ou un état est représenté par plusieurs systèmes, il doit être clair quel système possède la vérité gameplay ; les systèmes de représentation, présentation ou intégration technique ne doivent pas devenir implicitement propriétaires d’une vérité gameplay appartenant à un autre système. (5) Comportement observable — pour une situation déjà définie, il ne doit pas subsister de contradiction permettant deux comportements fondamentaux différents selon l’interprétation ; le joueur doit obtenir un comportement cohérent et déterministe à partir des règles déjà validées. Non bloquant : détails secondaires, variantes futures, optimisations, cas rares sans impact fondateur, décisions explicitement reportées, choix précisés ultérieurement sans remettre en cause les fondations. Règle directrice : une implémentation structurante ne démarre pas lorsqu’une contradiction peut encore modifier son comportement fondateur, ses dépendances critiques ou sa source de vérité. Une implémentation peut commencer alors que des détails secondaires restent ouverts, dès lors qu’ils ne menacent pas les fondations. Lien 14.1 : 14.1 = seuil de complétude d’un domaine ; 14.2 = cohérence globale du modèle — critères distincts, non fusionnés."
          },
          {
            "id": "dg14-03",
            "code": "14.3",
            "title": "Cohorte minimale de preuve",
            "status": "VALIDÉ",
            "subpoints": [
              "Plus petit ensemble jouable",
              "9 critères de démonstration",
              "Ancrage 12.5 / 02.11 forestier",
              "Étapes conditionnelles",
              "Hors couverture totale",
              "Preuve nécessaire ≠ 14.1/14.2/14.4"
            ],
            "dependsOn": [
              "14.1",
              "14.2",
              "12.5",
              "02.11",
              "DG-13"
            ],
            "impacts": [
              "14.4"
            ],
            "decision": "La cohorte minimale de preuve ne cherche pas à représenter tout le jeu. Elle constitue le plus petit ensemble de contenu réellement jouable permettant de démontrer la boucle fondamentale du modèle GardenFervor. Elle doit permettre de vérifier, dans un espace cohérent : (1) une intention formulée par le joueur ; (2) un chantier dont l’implantation est validée ; (3) l’analyse des conditions nécessaires ; (4) une chaîne d’unités autonomes coopérant pour réaliser l’opération ; (5) une préparation du terrain si nécessaire ; (6) une extraction, un transport et/ou un stockage lorsqu’ils sont nécessaires ; (7) une construction ou opération conduisant à une mise en service ; (8) une conséquence fonctionnelle, territoriale ou environnementale observable ; (9) une lisibilité suffisante permettant au joueur de comprendre ce qu’il a demandé, ce qui se passe, pourquoi une opération avance/attend/est bloquée, et ce que le résultat permet ensuite. Ancrage : peut s’appuyer sur la preuve DG-12 autour de la petite exploitation forestière (02.11 / 12.5) — intention → chantier → analyse → préparation éventuelle → extraction/transport → stockage → construction → mise en service → ressource disponible — sans obligation de définir immédiatement un catalogue complet ; le plus petit ensemble jouable reste prioritaire. Les étapes préparation / extraction / transport / stockage restent conditionnelles au besoin réel. Hors périmètre de la cohorte : tous les bâtiments, types d’unités, environnements, ressources, réseaux, technologies, opérations de terraformation, variantes écologiques, production de contenu future. Règle directrice : plus petit ensemble permettant de démontrer, dans une situation réellement jouable, intention joueur + exécution autonome de la chaîne + dépendances/blocages compréhensibles + conséquence fonctionnelle ou territoriale observable. La réussite de la cohorte ne valide pas tout le jeu ; elle valide que le modèle fondamental est suffisamment concret pour passer à l’implémentation contrôlée. Preuve nécessaire de concrétude — ne remplace ni 14.1, ni 14.2, ni 14.4."
          },
          {
            "id": "dg14-04",
            "code": "14.4",
            "title": "Passage en implémentation contrôlée",
            "status": "VALIDÉ",
            "subpoints": [
              "Conditions démarrage 1–4",
              "Limite = cohorte seule",
              "Preuve réversible",
              "Validation humaine après construction",
              "≠ production de masse",
              "≠ validation auto du design"
            ],
            "dependsOn": [
              "14.1",
              "14.2",
              "14.3"
            ],
            "impacts": [],
            "decision": "Objectif : définir les conditions permettant de passer du Design Gate à une première implémentation contrôlée, limitée à la cohorte minimale de preuve (DG-14.3). Cette autorisation ne constitue ni une validation définitive de l’architecture, ni une autorisation de production de masse, ni une validation automatique du modèle de jeu. I. Conditions d’autorisation de démarrage — l’implémentation contrôlée peut commencer lorsque : (1) Fondations suffisamment définies — les domaines nécessaires à la cohorte disposent du niveau de complétude DG-14.1 (objectif clair ; comportement essentiel décidé ; dépendances importantes connues ; limites explicites ; interactions critiques cohérentes ; lisibilité attendue définie) ; il n’est pas nécessaire que tout le jeu soit spécifié. (2) Contradictions bloquantes éliminées — conformément à DG-14.2 : aucune contradiction fondatrice ; aucune dépendance critique contradictoire ; aucune ambiguïté de source de vérité susceptible de modifier le comportement ; aucun conflit permettant deux comportements fondamentaux différents. (3) Cohorte minimale définie — conformément à DG-14.3, le plus petit ensemble jouable permettant de démontrer le modèle fondamental est identifié ; tout son contenu n’a pas besoin d’être déjà produit. (4) Critères de réussite observables définis — il doit être possible de déterminer concrètement, après construction de la preuve, si celle-ci fonctionne à partir de comportements observables dans le jeu ; les critères ne doivent pas dépendre uniquement de métriques internes ou de la présence de code. II. Limite de l’autorisation — porte uniquement sur la construction de la cohorte minimale de preuve ; n’autorise pas automatiquement : production de masse ; catalogue complet ; systèmes inutiles à la preuve ; extension automatique à l’ensemble du jeu. III. Obligations liées à la preuve — (5) Preuve réversible : si l’implémentation révèle une contradiction ou insuffisance fondamentale, l’implémentation doit pouvoir être arrêtée, le Design Gate concerné peut être rouvert, et le point problématique doit être réexaminé avant toute extension ; la construction de la preuve n’est pas une validation automatique du design. (6) Validation humaine obligatoire : la preuve doit être observée dans le comportement réel du jeu (compréhension de l’intention ; autonomie des unités ; lisibilité des blocages ; cohérence de la chaîne opérationnelle ; résultat fonctionnel ou territorial attendu) ; cette validation intervient après construction de la preuve et ne constitue pas une condition déjà satisfaite pour commencer son implémentation. Règle directrice : l’implémentation contrôlée peut commencer lorsque les fondations nécessaires sont suffisamment définies, que les contradictions bloquantes sont éliminées, que la cohorte minimale de preuve est définie et que ses critères de réussite observables sont définis. L’autorisation porte uniquement sur la construction de cette preuve ; sa réalisation reste réversible et sa validation humaine est obligatoire avant toute conclusion sur la validité du comportement démontré ou toute extension significative de l’implémentation. Transition : 14.1 = suffisamment défini ; 14.2 = suffisamment cohérent ; 14.3 = preuve minimale définie ; 14.4 = autorisation contrôlée de construire cette preuve ; validation humaine = vérification du résultat réel ; extension = uniquement après décision appropriée, jamais automatiquement."
          }
        ]
      }
    ],
    "validationRules": [
      "Une décision ne passe à VALIDÉ que lorsqu’elle a été explicitement confirmée, pas parce qu’elle semble logique.",
      "Une question ouverte reste À DÉFINIR même si une solution paraît évidente.",
      "Une décision qui dépend d’un autre choix doit pouvoir rester DÉPENDANT sans être forcée.",
      "À TESTER sert aux concepts acceptés mais qui doivent encore être confrontés au gameplay réel.",
      "Le Design Gate décrit le gameplay et ses règles ; il ne sert pas à figer prématurément l’architecture C++/Blueprint.",
      "Le passage vers l’implémentation doit être ciblé, incrémental et précédé d’une validation de conception.",
      "Document vivant : consulter avant chaque mécanique importante ; mettre à jour immédiatement après chaque décision utilisateur.",
      "Une implémentation qui fonctionne ne valide pas à elle seule une règle de gameplay.",
      "Si Design Gate ≠ implémentation : signaler explicitement et trancher avec l’utilisateur — ne pas corriger en silence.",
      "Le code existant n’est pas autorité de conception contre une décision VALIDÉE ; une feature non décidée n’est pas design officiel.",
      "Après impact conception, le compte rendu doit indiquer : Design Gate — aucune modification / mis à jour / nouveau point à définir.",
      "Lorsqu’un jalon important modifie ou révèle une règle de conception, mettre à jour le Design Gate avant de considérer le travail complètement documenté.",
      "Lorsqu’une décision est ajoutée, validée ou modifiée, vérifier et mettre à jour ses dépendances et impacts concernés.",
      "Une décision gameplay non explicitement prise ne doit jamais être inventée, supposée validée ou déduite arbitrairement : la laisser ouverte ou la remonter comme question de conception."
    ],
    "outOfScope": [
      "City-builder classique comme identité centrale.",
      "Microgestion permanente de chaque déplacement ou tâche.",
      "Prévisualisation complète et prédictive du chantier avant validation.",
      "Systèmes techniques ajoutés uniquement parce qu’ils sont possibles mais sans valeur de gameplay démontrée.",
      "Toute architecture externe imposée avant que le Design Gate n’en ait besoin."
    ]
  }
}
</script>
<script>
const {useMemo, useState} = React;
const DATA = JSON.parse(document.getElementById('data').textContent);
const {DESIGN_GATE, STATUS_META} = DATA;
const h = React.createElement;
const STATUS = ['TOUS', 'VALIDÉ', 'À DÉFINIR', 'À TESTER', 'DÉPENDANT', 'HORS PÉRIMÈTRE', 'À RÉÉVALUER'];
const STATUS_CLASS = {'VALIDÉ':'v','À DÉFINIR':'o','À TESTER':'t','DÉPENDANT':'d','HORS PÉRIMÈTRE':'hp','À RÉÉVALUER':'r'};

function getStats(section){
  return section.items.reduce((a, i) => {
    a.total++;
    if(i.status==='VALIDÉ') a.v++;
    else if(i.status==='À DÉFINIR') a.o++;
    else if(i.status==='À TESTER') a.t++;
    else if(i.status==='DÉPENDANT') a.d++;
    else if(i.status==='HORS PÉRIMÈTRE') a.hp++;
    else if(i.status==='À RÉÉVALUER') a.r++;
    return a;
  }, {total:0,v:0,o:0,t:0,d:0,hp:0,r:0});
}

function renderMarkdown(gate){
  const out = [];
  out.push('# ' + gate.title + ' ' + gate.version);
  out.push('');
  out.push('> Document de conception vivant. Les éléments non explicitement validés restent ouverts.');
  out.push('');
  out.push('## Principes déjà retenus');
  gate.principles.forEach(p => out.push('- **' + p.tag + '** — ' + p.text));
  out.push('');
  gate.sections.forEach(section => {
    out.push('## ' + section.code + ' — ' + section.title);
    out.push('');
    out.push('**Objectif :** ' + section.goal);
    out.push('');
    section.items.forEach(i => {
      out.push('### ' + i.code + ' — ' + i.title + ' — [' + i.status + ']');
      if(i.decision) out.push('**Décision retenue :** ' + i.decision);
      if(i.question) out.push('**Question à trancher :** ' + i.question);
      if(i.subpoints && i.subpoints.length){
        out.push('**À définir / vérifier exactement :**');
        i.subpoints.forEach(x => out.push('- ' + x));
      }
      if(i.example) out.push('**Exemple :** ' + i.example);
      if(i.dependsOn && i.dependsOn.length) out.push('**Dépend de :** ' + i.dependsOn.join(', '));
      if(i.impacts && i.impacts.length) out.push('**Impacte :** ' + i.impacts.join(', '));
      out.push('');
    });
  });
  out.push('## Conditions de validation');
  gate.validationRules.forEach(x => out.push('- ' + x));
  out.push('');
  out.push('## Hors périmètre actuel');
  gate.outOfScope.forEach(x => out.push('- ' + x));
  return out.join('\n');
}

function Badge({status}){
  return h('span', {className:'badge ' + STATUS_CLASS[status]}, status);
}

function Item({item}){
  const [open, setOpen] = useState(true);
  const children = [];
  if(item.decision) children.push(h('div',{className:'call decision',key:'decision'},h('b',null,'Décision retenue'),h('p',null,item.decision)));
  if(item.question) children.push(h('div',{className:'call question',key:'question'},h('b',null,'? Question à trancher'),h('p',null,item.question)));
  if(item.subpoints && item.subpoints.length){
    children.push(h('div',{key:'subpoints'},
      h('div',{className:'subLabel'},'À définir / vérifier exactement'),
      h('div',{className:'chips'},item.subpoints.map(x => h('span',{key:x},x)))
    ));
  }
  if(item.example) children.push(h('div',{className:'example',key:'example'},h('b',null,'Exemple de référence'),h('p',null,item.example)));
  return h('article',{className:'item',id:item.id},
    h('button',{className:'itemHead',onClick:()=>setOpen(v=>!v)},
      h('div',{className:'itemMain'},
        h('div',{className:'icode'},item.code),
        h('div',null,h('div',{className:'itemTitle'},item.title),h(Badge,{status:item.status}))
      ),
      open ? '▾' : '▸'
    ),
    open ? h('div',{className:'itemBody'},children) : null
  );
}

function Section({section,expanded,onToggle}){
  const st = getStats(section);
  const body = expanded ? h('div',{className:'body'},
    h('div',{className:'sectionMeta'},
      h('div',{className:'metaBlock'},h('span',null,'Objectif'),h('strong',null,section.goal)),
      h('div',{className:'metaBlock'},h('span',null,'Dépend de'),h('strong',null,section.dependsOn.length ? section.dependsOn.join(' · ') : 'Aucune dépendance critique')),
      h('div',{className:'metaBlock'},h('span',null,'Impacte'),h('strong',null,section.impacts.length ? section.impacts.join(' · ') : 'À déterminer'))
    ),
    section.visible.map(i => h(Item,{key:i.id,item:i}))
  ) : null;
  return h('section',{className:'gate',id:section.id},
    h('button',{className:'gateHead',onClick:onToggle},
      h('div',{className:'gateLeft'},
        h('div',{className:'gcode'},section.code),
        h('div',null,h('div',{className:'gtitle'},section.title),h('div',{className:'goal'},section.goal))
      ),
      h('div',{className:'mini'},
        h('i',{className:'v'},st.v),h('i',{className:'o'},st.o),h('i',{className:'d'},st.d),expanded?'▾':'▸'
      )
    ),
    body
  );
}

function App(){
  const [query,setQuery] = useState('');
  const [filter,setFilter] = useState('TOUS');
  const [onlyQuestions,setOnlyQuestions] = useState(false);
  const [openSections,setOpenSections] = useState(() => new Set(DESIGN_GATE.sections.map(s=>s.id)));
  const [active,setActive] = useState('dg00');

  const flat = DESIGN_GATE.sections.flatMap(s=>s.items);
  const counts = flat.reduce((a,i)=>{
    if(i.status==='VALIDÉ') a.v++;
    else if(i.status==='À DÉFINIR') a.o++;
    else if(i.status==='À TESTER') a.t++;
    else if(i.status==='DÉPENDANT') a.d++;
    else if(i.status==='HORS PÉRIMÈTRE') a.hp++;
    return a;
  },{v:0,o:0,t:0,d:0,hp:0});
  const completion = Math.round((counts.v / Math.max(1,flat.length-counts.hp))*100);

  const sections = useMemo(() => {
    const q = query.trim().toLowerCase();
    return DESIGN_GATE.sections.map(section => {
      const sectionText = [section.code,section.title,section.goal,...section.tags].join(' ').toLowerCase();
      const visible = section.items.filter(i => {
        const text = [i.code,i.title,i.status,i.decision||'',i.question||'',...(i.subpoints||[])].join(' ').toLowerCase();
        const matchesText = !q || text.includes(q) || sectionText.includes(q);
        const matchesStatus = filter==='TOUS' || i.status===filter;
        const matchesQuestion = !onlyQuestions || Boolean(i.question);
        return matchesText && matchesStatus && matchesQuestion;
      });
      return {...section,visible};
    }).filter(section => section.visible.length || (!query && filter==='TOUS' && !onlyQuestions));
  },[query,filter,onlyQuestions]);

  function toggleSection(id){
    setOpenSections(current => {
      const next = new Set(current);
      if(next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }
  function goTo(id){
    setActive(id);
    setOpenSections(current=>new Set(current).add(id));
    setTimeout(()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'}),0);
  }
  function exportMarkdown(){
    const blob = new Blob([renderMarkdown(DESIGN_GATE)],{type:'text/markdown;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'GardenFervor_DESIGN_GATE_v0.1.md';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }

  return h('div',{className:'app'},
    h('header',{className:'topbar'},
      h('div',{className:'brand'},
        h('div',{className:'mark'},'✦'),
        h('div',null,h('div',{className:'eyebrow'},'GARDENFERVOR'),h('div',{className:'title'},'DESIGN GATE ',h('span',null,'v0.1')))
      ),
      h('div',{className:'actions'},h('div',{className:'chip'},'● Document actif'),h('button',{className:'btn',onClick:exportMarkdown},'↓ Exporter Markdown'))
    ),
    h('div',{className:'layout'},
      h('aside',{className:'side'},
        h('div',{className:'search'},'⌕',h('input',{value:query,onChange:e=>setQuery(e.target.value),placeholder:'Rechercher dans le Gate…'})),
        h('div',{className:'filters'},
          h('select',{value:filter,onChange:e=>setFilter(e.target.value)},STATUS.map(s=>h('option',{key:s,value:s},s==='TOUS'?'Tous les statuts':s))),
          h('button',{className:onlyQuestions?'active':'',onClick:()=>setOnlyQuestions(v=>!v)},'? Questions')
        ),
        h('div',{className:'nav'},sections.map(section=>{
          const st = getStats(section);
          const expanded = openSections.has(section.id);
          return h('div',{key:section.id,className:'navGroup '+(active===section.id?'active':'')},
            h('button',{className:'navSection',onClick:()=>{toggleSection(section.id);goTo(section.id)}},
              expanded?'▾':'▸',h('span',{className:'code'},section.code),h('span',{className:'name'},section.title),h('span',{className:'count'},st.o+st.d)
            ),
            expanded ? h('div',{className:'sub'},section.items.map(i=>h('button',{key:i.id,onClick:()=>document.getElementById(i.id)?.scrollIntoView({behavior:'smooth',block:'start'})},h('span',null,i.code),i.title))) : null
          );
        }))
      ),
      h('main',{className:'main'},
        h('section',{className:'hero'},
          h('div',null,
            h('div',{className:'eyebrow'},'CONTRAT DE CONCEPTION'),
            h('h1',null,'Construire le jeu avant de construire le système.'),
            h('p',{className:'lead'},'Ce Design Gate définit les décisions de gameplay à prendre avant l’implémentation. Il organise le questionnaire de conception sans transformer les hypothèses en règles arbitraires.'),
            h('div',{className:'rule'},'✦ ',h('strong',null,'Principe central : '),'le joueur décide ce qu’il veut obtenir ; le monde détermine comment y parvenir.')
          ),
          h('div',{className:'progress'},
            h('div',{className:'progressLine'},h('span',null,'Avancement de conception'),h('strong',null,completion+'%')),
            h('div',{className:'bar'},h('div',{className:'fill',style:{width:Math.min(completion,100)+'%'}})),
            h('div',{className:'meta'},counts.v+' validées · '+(counts.o+counts.d)+' ouvertes · '+counts.t+' à tester')
          )
        ),
        h('section',{className:'stats'},[
          ['✓','Validé',counts.v,'validated'],['?','À définir',counts.o,'open'],['↔','Dépendant',counts.d,'dep'],['T','À tester',counts.t,'test']
        ].map(x=>h('div',{className:'stat',key:x[1]},h('b',{className:x[3]},x[0]+' '+x[2]),h('small',null,x[1])))),
        h('section',{className:'principles'},h('div',{className:'sectionMini'},'Fondations déjà retenues'),h('div',{className:'principleGrid'},DESIGN_GATE.principles.map(p=>h('div',{className:'principle',key:p.id},h('div',{className:'tag'},p.tag),h('p',null,p.text))))),
        h('div',{className:'heading'},
          h('div',null,h('div',{className:'eyebrow'},'WORKSPACE DE CONCEPTION'),h('h2',null,'Questionnaire structuré'),h('p',null,'Chaque grande section précise exactement ce qui doit être décidé. Les éléments encore inconnus restent ouverts.')),
          h('div',{className:'legend'},Object.keys(STATUS_META).map(s=>h(Badge,{key:s,status:s})))
        ),
        h('div',null,sections.map(section=>h(Section,{key:section.id,section,expanded:openSections.has(section.id),onToggle:()=>toggleSection(section.id)}))),
        h('div',{className:'bottom'},
          h('div',{className:'panel'},h('h3',null,'Règles de validation'),h('ul',null,DESIGN_GATE.validationRules.map(x=>h('li',{key:x},x)))),
          h('div',{className:'panel'},h('h3',null,'Hors périmètre actuel'),h('ul',null,DESIGN_GATE.outOfScope.map(x=>h('li',{key:x},x))))
        ),
        h('div',{className:'footer'},h('span',null,'GardenFervor · Design Gate v0.1'),h('span',null,'Document vivant · aucune question ouverte n’est présumée validée.'))
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body></html>
